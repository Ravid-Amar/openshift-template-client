[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openshift-template-client"
version = "0.1.0.dev0"
description = "Small Python client for OpenShift templates and their resources"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["kubernetes>=30,<35"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
