name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        # The version remains explicit in pyproject.toml; tagging never rewrites it.
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} must match package version: {expected!r}")
          print(f"Building release {version}")
          PY
      - name: Install build tools
        run: python -m pip install 'build>=1,<2' 'twine>=6,<7'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - name: Verify wheel installation in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c 'import openshift_templates'
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/openshift-template-client/
    # Only this job can obtain the OIDC identity used by PyPI Trusted Publishing.
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      # Publish exactly the artifacts built above; no checkout or build runs here.
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
